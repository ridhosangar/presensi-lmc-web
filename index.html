<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Presensi LMC" />
  <meta name="theme-color" content="#1565c0" />
  <title>Presensi LMC — iPhone</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <!-- LOGIN -->
  <div id="screen-login" class="card">
    <h1>Presensi LMC</h1>
    <p class="sub">Versi web untuk iPhone — masuk &amp; pulang</p>
    <div id="login-error" class="error hidden"></div>
    <label>Username</label>
    <input id="username" autocomplete="username" placeholder="username" />
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="password" />
    <button class="btn-primary" id="btn-login">Masuk</button>
    <small class="hint">Khusus karyawan. Admin tetap pakai app Android.</small>
  </div>

  <!-- HOME -->
  <div id="screen-home" class="card hidden">
    <div class="user-bar">
      <div>
        <strong id="nama-user">—</strong>
        <div class="sub" style="margin:0" id="jabatan-user"></div>
      </div>
      <button class="btn-outline" id="btn-logout" style="width:auto;padding:8px 14px;margin:0">Keluar</button>
    </div>
    <button class="btn-masuk" id="btn-masuk">Presensi Masuk</button>
    <button class="btn-pulang" id="btn-pulang">Presensi Pulang</button>
    <small class="hint">Izinkan kamera &amp; lokasi saat diminta.</small>
  </div>

  <!-- KAMERA -->
  <div id="screen-camera" class="card hidden">
    <h1 id="camera-title">Presensi</h1>
    <p class="sub">Posisikan wajah di tengah, pencahayaan cukup</p>
    <div id="cam-error" class="error hidden"></div>
    <video id="video" playsinline autoplay muted></video>
    <canvas id="preview" class="hidden"></canvas>
    <canvas id="work" class="hidden" width="112" height="112"></canvas>
    <button class="btn-primary" id="btn-capture">Ambil Foto &amp; Presensi</button>
    <button class="btn-outline" id="btn-cancel-cam">Batal</button>
    <div id="proses" class="hidden" style="text-align:center;padding:16px">
      <p>Memproses…</p>
    </div>
  </div>

  <!-- HASIL -->
  <div id="screen-hasil" class="card hidden">
    <h1 id="hasil-judul">Hasil</h1>
    <p id="hasil-pesan" class="sub"></p>
    <div id="hasil-detail" class="detail"></div>
    <button class="btn-primary" id="btn-selesai">Selesai</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.9/dist/tf-tflite.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
